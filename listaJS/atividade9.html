<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
        }
        div{
            height: 30vh;
            width: 20vw;
            display: flex;
            justify-content: center;
            align-items: end;
            padding: 2rem;
            font-size: 30px;
            font-weight: bold;
            color: auto;
        }
        #box1{
            background-color: #05668D;
            color:white;
        }
        #box2{
            background-color: #427AA1;
        }
        #box3{
            background-color: #EBF2FA;
            
        }
        #box4{
            background-color: #679436;
        }
        #box5{
            background-color: #A5BE00;
        }
    </style>
</head>
<body>
    <div id="box1">#05668D</div>
    <div id="box2">#427AA1</div>
    <div id="box3">#EBF2FA</div>
    <div id="box4">#679436</div>
    <div id="box5">#A5BE00</div>
    <script>
        function trocaCor(){
            let cor1 = Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0');
            let cor2 = Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0');
            let cor3 = Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0');
            let cor4 = Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0');
            let cor5 = Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0');

            let box1 = document.getElementById('box1');
            let box2 = document.getElementById('box2');
            let box3 = document.getElementById('box3');
            let box4 = document.getElementById('box4');
            let box5 = document.getElementById('box5');

            box1.style.backgroundColor = '#' + cor1;
            box1.innerText = cor1;
            box2.style.backgroundColor = '#' + cor2;
            box2.innerText = cor2;
            box3.style.backgroundColor = '#' + cor3;
            box3.innerText = cor3;
            box4.style.backgroundColor ='#' +  cor4;
            box4.innerText = cor4;
            box5.style.backgroundColor = '#' + cor5;
            box5.innerText = cor5;
        }
        window.addEventListener('keyup', (e) => {
            var tecla = e.keyCode;
            var ehEspaco = tecla == 32;
            if(ehEspaco){
                trocaCor();
            }
        })
    </script>
</body>
</html>
