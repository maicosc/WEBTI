<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button{
            width: 15vw;
            height: 5vh;
            background-color: rgb(59, 150, 150);
            border-radius: 1rem;
            color: azure;
            font-weight: bold;
            font-size: 27px;
        }
    </style>
</head>
<body>
    <button onclick="sortearCor()">SORTEAR COR</button>
    <script>
        function sortearCor(){
            let r = Math.floor(Math.random()*255)+1
            let g = Math.floor(Math.random()*255)+1
            let b = Math.floor(Math.random()*255)+1

            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`
        }
    </script>
</body>
</html>
