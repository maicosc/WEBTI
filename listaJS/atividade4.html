<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <input type="text" id="nome" placeholder="Digite o seu nome">
    <input type="number" id="peso" placeholder="Digite seu peso em Kg" step="0.1">
    <input type="number" id="altura" placeholder="Digite sua altura em m" step="0.01">
    <button id="calcular">Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img id="imgPerfil" src="./perfil.jpg">

    <script>
        
        const potencia = (num, expoente) => {

            let resultado = num
            if(expoente === 0){
                return 1
            }
            for (let a= 1; a < expoente; a++){
                
                resultado=resultado*num
            }
            return resultado
        }
        
        
        let botaoCalc = document.getElementById("calcular");
        botaoCalc.addEventListener("click", ()=>{

            let nome = document.getElementById("nome").value;
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);
            console.log(nome)
            console.log(peso)
            console.log(altura)
            if(nome.trim() !== '' &&  !isNaN(altura) && !isNaN(peso) && peso > 0 && altura > 0){

                
                let imc = peso / potencia(altura, 2)
                let imcFixed = imc.toFixed(2)
                document.getElementById("resultadoIMC").innerText = nome + " seu IMC é "+imcFixed

                if( imc < 18.5){
                    document.getElementById('classificacao').innerText = "Abaixo do Peso"
                    document.getElementById("imgPerfil").src = "./abaixopeso.png"
                }else if(imc >= 18.5 && imc < 25){
                    document.getElementById('classificacao').innerText = "Peso Normal"
                    document.getElementById("imgPerfil").src = "./normal.png"
                }else if(imc >= 25 && imc < 30){
                    document.getElementById('classificacao').innerText = "Sobrepeso"
                    document.getElementById("imgPerfil").src = "./sobrepeso.png"
                }else if(imc >= 30 && imc < 35){
                    document.getElementById('classificacao').innerText = "Obesidade grau 1"
                    document.getElementById("imgPerfil").src = "./obesidade1.png"
                }else if(imc >= 35 && imc < 40){
                    document.getElementById('classificacao').innerText = "Obesidade grau 2"
                    document.getElementById("imgPerfil").src = "./obesidade2.png"
                }else if(imc >= 40){
                    document.getElementById('classificacao').innerText = "Obesidade grau 3 (Mórbida)"
                    document.getElementById("imgPerfil").src = "./obesidade3.png"
                }
                
            }else{
                alert("Preencha TODOS os campos!");
                
            }
        });
        
        
        
    </script>
</body>
</html>
